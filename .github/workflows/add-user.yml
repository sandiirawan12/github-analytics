name: Add User

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  register:
    if: startsWith(github.event.issue.title, 'add-user:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse username
        id: user
        run: |
          set -euo pipefail
          TITLE="${{ github.event.issue.title }}"
          LOGIN=$(echo "$TITLE" | sed -E 's/^[Aa]dd-[Uu]ser:[[:space:]]*//;s/^@//;s/[[:space:]]//g' | tr '[:upper:]' '[:lower:]')
          if ! echo "$LOGIN" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$'; then
            echo "Invalid username: $LOGIN"
            exit 1
          fi
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"

      - name: Add to users.yml
        run: |
          set -euo pipefail
          LOGIN="${{ steps.user.outputs.login }}"
          if grep -qiE "^[[:space:]]*-[[:space:]]*${LOGIN}$" users.yml; then
            echo "already=true" >> "$GITHUB_ENV"
          else
            echo "  - $LOGIN" >> users.yml
            echo "already=false" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate cards for user
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          OUTPUT_DIR: ./output
        run: npm run generate -- --user=${{ steps.user.outputs.login }}

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > output/updated_at.txt
          git add users.yml output/
          git commit -m "chore: add user ${{ steps.user.outputs.login }} [skip ci]" || echo "No changes"
          git push origin HEAD:main

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const login = '${{ steps.user.outputs.login }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/main/output/${login}`;
            const body = [
              `✅ Cards ready for **@${login}**`,
              '',
              'Paste this into your profile README (`USERNAME/USERNAME`):',
              '',
              '```md',
              `<p align="center"><img src="${base}/dashboard.svg" /></p>`,
              `<p align="center">`,
              `  <img width="49%" src="${base}/stats.svg" />`,
              `  <img width="49%" src="${base}/streak.svg" />`,
              `</p>`,
              `<p align="center"><img src="${base}/activity.svg" /></p>`,
              `<p align="center">`,
              `  <img width="49%" src="${base}/languages.svg" />`,
              `  <img width="49%" src="${base}/productive-time.svg" />`,
              `</p>`,
              `<p align="center">`,
              `  <img width="49%" src="${base}/repositories.svg" />`,
              `  <img width="49%" src="${base}/contributions.svg" />`,
              `</p>`,
              `<p align="center"><img src="${base}/achievements.svg" /></p>`,
              '```',
              '',
              'Public stats are included. Private stats need your own PAT on a fork.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
