name: Generate Analytics

on:
  schedule:
    # Every 6 hours (keeps cards fresh throughout the day)
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "**.md"

concurrency:
  group: generate-analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SVG cards from live GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # Optional overrides — empty means app uses analytics.config.yml
          # then falls back to the repository owner automatically.
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          OUTPUT_DIR: ./output
        run: npm run generate

      - name: Commit cards to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          date -u +"%Y-%m-%dT%H:%M:%SZ" > output/updated_at.txt
          git add output/*.svg output/stats.json output/updated_at.txt

          if git diff --staged --quiet; then
            echo "forced refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> output/updated_at.txt
            git add output/updated_at.txt
          fi

          git commit -m "chore: refresh analytics cards [skip ci]"
          git push origin HEAD:main
