name: Generate Analytics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "Optional — generate only this GitHub username (also adds to users.yml)"
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "**.md"

concurrency:
  group: generate-analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register username from workflow input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.username != '' }}
        env:
          INPUT_USER: ${{ inputs.username }}
        run: |
          set -euo pipefail
          LOGIN=$(echo "$INPUT_USER" | tr '[:upper:]' '[:lower:]' | sed 's/^@//;s/ //g')
          test -n "$LOGIN"
          if ! grep -qiE "^[[:space:]]*-[[:space:]]*${LOGIN}$" users.yml; then
            echo "  - $LOGIN" >> users.yml
            echo "Added $LOGIN to users.yml"
          else
            echo "$LOGIN already listed"
          fi

      - name: Generate SVG cards from live GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          OUTPUT_DIR: ./output
          ONLY_USER: ${{ inputs.username }}
        run: |
          if [ -n "${ONLY_USER:-}" ]; then
            LOGIN=$(echo "$ONLY_USER" | tr '[:upper:]' '[:lower:]' | sed 's/^@//;s/ //g')
            npm run generate -- --user="$LOGIN"
          else
            npm run generate
          fi

      - name: Commit cards to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          date -u +"%Y-%m-%dT%H:%M:%SZ" > output/updated_at.txt
          git add users.yml output/

          if git diff --staged --quiet; then
            echo "forced refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> output/updated_at.txt
            git add output/updated_at.txt
          fi

          git commit -m "chore: refresh analytics cards [skip ci]"
          git push origin HEAD:main
