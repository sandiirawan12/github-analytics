name: Generate Analytics

on:
  schedule:
    # Every 6 hours (keeps cards fresh throughout the day)
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "analytics.config.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate.yml"

concurrency:
  group: generate-analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SVG cards from live GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || github.repository_owner }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Jakarta' }}
          OUTPUT_DIR: ./output
        run: npm run generate

      - name: Publish to output branch
        env:
          TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUBLISH_DIR=$(mktemp -d)
          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git clone --depth 1 --branch output "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"
          else
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"
            cd "$PUBLISH_DIR"
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi

          rm -f "$PUBLISH_DIR"/*.svg "$PUBLISH_DIR"/stats.json "$PUBLISH_DIR"/updated_at.txt
          cp output/*.svg output/stats.json "$PUBLISH_DIR/"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$PUBLISH_DIR/updated_at.txt"

          cd "$PUBLISH_DIR"
          git add -A

          # Always commit so CDN/camo caches see a new revision
          if git diff --staged --quiet; then
            echo "forced refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> updated_at.txt
            git add updated_at.txt
          fi

          git commit -m "chore: refresh analytics cards $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:output
