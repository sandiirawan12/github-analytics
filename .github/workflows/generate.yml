name: Generate Analytics

on:
  schedule:
    # Hourly — GitHub may delay cron slightly; use Run workflow for instant refresh
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "**.md"

concurrency:
  group: generate-analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SVG cards from live GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          OUTPUT_DIR: ./output
        run: npm run generate

      - name: Commit cards to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --staged --quiet; then
            echo "forced refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> output/updated_at.txt
            git add output/updated_at.txt
          fi

          git commit -m "chore: refresh analytics cards [skip ci]"
          git push origin HEAD:main

          BUST=$(tr -d '[:space:]' < output/updated_at.txt | sed 's/\.[0-9]*Z$/Z/' | tr -d ':-')
          echo "bust=$BUST" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr CDN cache
        continue-on-error: true
        run: |
          REPO="${{ github.repository }}"
          for f in dashboard stats streak activity languages productive-time repositories contributions achievements; do
            curl -fsS "https://purge.jsdelivr.net/gh/${REPO}@main/output/${f}.svg" || true
          done

      - name: Sync cache-bust params on profile README
        if: ${{ vars.PROFILE_REPO != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PROFILE_REPO: ${{ vars.PROFILE_REPO }}
          BUST: ${{ steps.commit.outputs.bust }}
          ANALYTICS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ] || [ -z "${BUST:-}" ]; then
            echo "Skip profile sync (missing GH_PAT or bust key)"
            exit 0
          fi

          tmp=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PROFILE_REPO}.git" "$tmp/profile"
          readme="$tmp/profile/README.md"
          if [ ! -f "$readme" ]; then
            echo "No README.md in ${PROFILE_REPO}"
            exit 0
          fi

          README_PATH="$readme" BUST="$BUST" ANALYTICS_REPO="$ANALYTICS_REPO" python3 <<'PY'
          import os, re, pathlib
          readme = pathlib.Path(os.environ["README_PATH"])
          bust = os.environ["BUST"]
          repo = os.environ["ANALYTICS_REPO"]
          text = readme.read_text(encoding="utf-8")
          patterns = [
              rf"(https://raw\.githubusercontent\.com/{re.escape(repo)}/main/output/[a-z0-9\-]+\.svg)(?:\?[^\"\s)]*)?",
              rf"(https://cdn\.jsdelivr\.net/gh/{re.escape(repo)}@main/output/[a-z0-9\-]+\.svg)(?:\?[^\"\s)]*)?",
          ]
          new = text
          for pat in patterns:
              new = re.sub(pat, rf"\1?v={bust}", new)
          if new == text:
              print("No matching image URLs to update")
          else:
              readme.write_text(new, encoding="utf-8")
              print("Updated cache-bust query params on profile README")
          PY

          cd "$tmp/profile"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Profile README already up to date"
            exit 0
          fi
          git commit -m "chore: refresh analytics cache bust ${BUST}"
          git push
